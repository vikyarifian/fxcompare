# System Configuration for FXCompare Application
spring.application.name=fxcompare

# Timezone settings (Asia/Jakarta)
spring.jackson.time-zone=Asia/Jakarta

# Database Connection (PostgreSQL 18)
spring.datasource.url=jdbc:postgresql://localhost:5432/fxcompare
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Workaround for Spring Boot 3.3/Hibernate 6.5 timezone mapping limitation where LocalTime/OffsetDateTime ignores the JVM local timezone and defaults to UTC
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

# Scheduled task configurations for daily rate ingestion (cron running at 08:00 WIB daily)
app.cron.ingestion=0 0 8 * * *

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.fxcompare=DEBUG
